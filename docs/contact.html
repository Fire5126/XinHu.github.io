<!DOCTYPE html>
<html>
    <head>
        <title>Portfolio</title>
        <link rel="stylesheet" href="style.css">
        <script src="./jquery-4.0.0.min.js"></script>
        <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0/dist/css/select2.min.css" rel="stylesheet"/>
        <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0/dist/js/select2.min.js"></script>
    </head>

    <script>
        $(document).ready(function(){
            $("#home-link").click(function(){
                window.location.href = "index.html"
            });

            $("#about-link").click(function(){
                window.location.href = "about.html"
            });

              $("#about-button").click(function(){
                window.location.href = "about.html"
            });

            $("#project-link").click(function(){
                window.location.href = "project.html"
            });

            $("#demo-link").click(function(){
                window.location.href = "demo.html"
            });

            $("#contact-link").click(function(){
                window.location.href = "contact.html"
            });

            const countryDropDown = $("#fcountry");

            $.getJSON("country-json.json", function(data){
                $.each(data, function(index, country){
                    var value = country.toLowerCase().replace(/\s+/g, "");
                    countryDropDown.append(
                        $('<option></option>')
                            .attr('value', value)
                            .text(country)
                    );
                });
            });

            countryDropDown.select2({
                theme: "elegant"
            });
        });
    </script>

    <body>  
        <header id="header">
       
            <div id="header-text">
                <h1 id="header-title">Xin Hu</h1>
                <p1 id="header-subtitle">Game Designer</p1>
            </div>
            <nav>
                <div id="header-links">
                   <button><p1 id="home-link" class="header-link">Home</p1></button>
                    <button><p1 id="about-link" class="header-link">About</p1></button>
                    <button><p1 id="project-link" class="header-link">Projects</p1></button>
                    <button><p1 id="demo-link" class="header-link">Demos</p1></button>
                    <button><p1 id="contact-link" class="header-link">Contact</p1></button>
                </div>
            </nav>

            <img id="header-logo">
        </header>

        <div id="contact-section">
            <div id="information-container">
                <h1>Contact Me</h1>
                <form name="input" method = "POST" action="https://formspree.io/Xin.Dobbie1@gmail.com">
                    <label for="fname" class="form-text">Name: </label>
                    <input type="text" name="Name" placeholder="Your Name..." id="fname">

                    <label for="femail" class="form-text">Email: </label>
                    <input type="email" name="_replyto" placeholder="Your Email..." id="femail">

                    <label for="fcountry" class="form-text">Country:</label>
                    <select name="country" id="fcountry">
                        <option value="" disabled selected>Select a country</option>
                    </select>

                    <label for="fsubject" class="form-text">Subject</label> 
                    <textarea name="subject" placeholder="Type your message..." id="fsubject"></textarea>
                    
                    <input type="submit" value="Send" id="form-submission">
                    <input type="hidden" name="_subject" value="New Submission!">
                </form>
            </div>
        </div>

        <footer id="footer">
            <!-- Links to various socials to get in contact with me -->
            <h3 id="footer-text">View my works:</h3>
            <nav>
                <ul id="footer-links">
                    <li class="media-link"><a href="https://www.linkedin.com/in/xin-hu-dobbie-929366380/"><img class="media-logo" src="./Imgs/LI-Logo.png" alt="LinkedIn logo link"></a></li>
                    <li class="media-link"><a href="https://www.youtube.com/@BinDiverC"><img class="media-logo" src="./Imgs/yt_logo_fullcolor_white_digital.png" alt="Youtube logo link"></a></li>
                    <li class="media-link"><a href="https://github.com/Fire5126"><img class="media-logo" src="./Imgs/GitHub_Lockup_White_Clearspace.png" alt="GitHub logo link"></a></li>
                </ul>
            </nav>
            <p id="footer-copyright">&copy; 2026 Xin Hu Dobbie. All Rights Reserved</p>
        </footer>
    </body>
</html>
